<body>
  <h1>Noted</h1>
  <p>Join a Google Meet and a <strong>Record</strong> button appears in the corner. It opens the recorder for that call — pick the Meet tab in the share dialog and tick <em>Share tab audio</em>.</p>
  <p>Nothing is recorded until you do that. This extension never captures audio on its own.</p>
