<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 300px; padding: 16px; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #e8e8ec; background: #141418; }
  h1 { margin: 0 0 6px; font-size: 14px; }
  p { margin: 0 0 12px; color: #a0a0aa; }
  label { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 14px; padding: 10px 12px; border-radius: 10px; background: #1e1e25; color: #e8e8ec; cursor: pointer; }
  label input { margin-top: 3px; }
  label small { display: block; color: #a0a0aa; }
  a { display: inline-block; padding: 8px 12px; border-radius: 8px; background: #2a2a33; color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <h1>Noted</h1>
  <p>Join a Google Meet and a <strong>Record with Noted</strong> button appears in the call bar. It opens the recorder for that call — pick the Meet tab in the share dialog and tick <em>Share tab audio</em>.</p>
  <label>
    <input type="checkbox" id="auto">
    <span>Open the recorder as soon as I join a call
      <small>In a background tab, with your calendar rule already applied. Nothing records until you approve the share dialog.</small>
    </span>
  </label>
  <p>This extension never captures audio on its own.</p>
  <a href="https://ainoted.vercel.app" target="_blank" rel="noopener">Open Noted</a>
  <script src="popup.js"></script>
</body>
</html>
